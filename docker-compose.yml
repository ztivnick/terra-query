services:
  db:
    build:
      context: ./infra/postgres
    image: terra-query-db:local
    container_name: terra-query-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra
      POSTGRES_DB: terra_query
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terra_query"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: terra-query-api:local
    container_name: terra-query-api
    restart: unless-stopped
    environment:
      # service-name host (not the host-only mapping)
      TERRA_QUERY_DATABASE_URL: postgresql://terra:terra@db:5432/terra_query
      TERRA_QUERY_CORS_ORIGINS: "http://localhost:5173,http://localhost:4173"
      # default off in-container; unset for in-container model loading
      TERRA_QUERY_SKIP_MODEL_LOAD: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments

volumes:
  pgdata:
