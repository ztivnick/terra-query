[project]
name = "terra-query"
version = "0.0.0"
description = "POC for natural-language retrieval of unmapped forest features."
requires-python = ">=3.12"
dependencies = [
    "pyproj>=3.6",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terra_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
