[project]
name = "terra-query"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "planetary-computer>=1.0.0",
    "pyarrow>=24.0.0",
    "pyproj>=3.7.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rio-cogeo>=7.0.2",
    "shapely>=2.1.2",
    "typer>=0.25.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = [
    "geopandas", "geopandas.*",
    "shapely", "shapely.*",
    "pyogrio", "pyogrio.*",
    "rasterio", "rasterio.*",
    "rio_cogeo", "rio_cogeo.*",
    "pystac", "pystac.*",
    "pystac_client", "pystac_client.*",
    "planetary_computer", "planetary_computer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "slow: tests that hit real network or disk data",
    "gpu: tests requiring MPS",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "responses>=0.26.0",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terra_query"]
